name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    name: Create tagged release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate version and define tag
        run: |
          VERSION="${{ inputs.version }}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must be semver-like (for example: 0.0.6 or 1.2.3-beta.1)."
            exit 1
          fi

          TAG="$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists on origin."
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Update version in manifest.json files
        run: |
          manifests_found=0
          for manifest in custom_components/*/manifest.json; do
            [ -f "$manifest" ] || continue
            manifests_found=1
            tmp="$(mktemp)"
            jq --arg v "$VERSION" '.version = $v' "$manifest" > "$tmp"
            mv "$tmp" "$manifest"
            echo "Updated $manifest to version $VERSION"
          done

          if [ "$manifests_found" -eq 0 ]; then
            echo "No manifest.json files found in custom_components/*."
            exit 1
          fi

      - name: Verify manifest versions match tag
        run: |
          mismatch=0
          for manifest in custom_components/*/manifest.json; do
            [ -f "$manifest" ] || continue
            manifest_version="$(jq -r '.version' "$manifest")"
            if [ "$manifest_version" != "$VERSION" ]; then
              echo "Mismatch in $manifest: expected $VERSION, found $manifest_version"
              mismatch=1
            fi
          done

          if [ "$mismatch" -ne 0 ]; then
            exit 1
          fi

      - name: Commit manifest version updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add custom_components/*/manifest.json
          if git diff --cached --quiet; then
            echo "Manifest versions already set to $VERSION."
          else
            git commit -m "Bump integration manifest versions to $VERSION"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Create and push tag
        run: |
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --generate-notes --verify-tag
