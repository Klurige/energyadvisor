name: Release
run-name: Release from ${{ github.ref_name }}

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    name: Create tagged release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read and validate committed version
        run: |
          if [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "Run the release workflow from a branch."
            exit 1
          fi

          VERSION=""
          for manifest in custom_components/*/manifest.json; do
            [ -f "$manifest" ] || continue
            manifest_version="$(jq -r '.version' "$manifest")"
            if [[ ! "$manifest_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid version in $manifest: $manifest_version"
              exit 1
            fi
            if [ -n "$VERSION" ] && [ "$manifest_version" != "$VERSION" ]; then
              echo "Manifest versions must match: $manifest has $manifest_version, expected $VERSION"
              exit 1
            fi
            VERSION="$manifest_version"
          done

          if [ -z "$VERSION" ]; then
            echo "No manifest.json files found in custom_components/*."
            exit 1
          fi

          echo "TAG=$VERSION" >> "$GITHUB_ENV"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            if [ "$(git rev-parse "$TAG^{commit}")" != "$(git rev-parse HEAD)" ]; then
              echo "Tag $TAG already exists on a different commit."
              exit 1
            fi
          else
            git tag -a "$TAG" -m "$TAG"
            git push origin "refs/tags/$TAG"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" --generate-notes --verify-tag
          fi
