export_grid_resale:
    description: Export the complete grid resale database to a private CSV snapshot. Returns a path and an authenticated download URL.
    fields:
        entry_id:
            description: Required if more than one entry has grid resale enabled.
            selector:
                text:
import_grid_resale_history:
    description: Import available recorder history without overwriting existing intervals. Hourly estimates are approximate and must be explicitly selected.
    fields:
        entry_id:
            description: Required if more than one entry has grid resale enabled.
            selector:
                text:
        start:
            required: true
            example: "2024-01-01T00:00:00+01:00"
            description: Inclusive start timestamp with an explicit UTC offset.
            selector:
                text:
        end:
            required: true
            example: "2026-01-01T00:00:00+01:00"
            description: Exclusive end timestamp with an explicit UTC offset. Hourly estimates require whole-hour boundaries.
            selector:
                text:
        source:
            default: raw
            description: Raw readings are preferred. Hourly estimates lose within-hour ordering and can undercount cycles.
            selector:
                select:
                    options:
                        - raw
                        - hourly_estimate
get_levels:
    description: Get electricity price levels for today and tomorrow.
    fields:
        entity_id:
            selector:
                entity:
                    domain: sensor
            description: Energy Advisor price sensor entity id. Required when multiple entries are loaded.
        level_length:
            selector:
                number:
                    min: 0
                    max: 1440
                    step: 1
                    mode: box
                    unit_of_measurement: minutes
            description: Length in minutes for each level. 0 means same as NordPool.
debug_select_date:
    description: Debug mode only. Collect the prices of a chosen date from elprisetjustnu.se and use them as today's prices instead of the live Nord Pool prices.
    fields:
        date:
            required: true
            example: "2026-10-24"
            selector:
                date:
            description: The date whose prices are collected. They are used as today's prices, with the same time of day.
        area:
            selector:
                select:
                    options:
                        - SE1
                        - SE2
                        - SE3
                        - SE4
            description: Price area. Defaults to the area in the configured Nord Pool price sensor entity id.
        entity_id:
            selector:
                entity:
                    domain: sensor
            description: Energy Advisor price sensor entity id. Required when multiple entries are in debug mode.
